# Frozen start states for Curling-FR3 with the "circle" puck, EXPERIMENTAL
# 90 deg-about-z lane rotation variant of ``curling_circle.yaml``.
#
# Not independently sampled: every (block_xy, ee_xy) pair and goal_xy here is
# that file's own row rotated 90 deg CCW about the world origin
# ((x, y) -> (-y, x)), block_yaw shifted by +pi/2 (wrapped to [-pi, pi]) --
# so index i here is the SAME frozen scenario as index i there, just rotated
# to match a lane built with CurlingFr3(lane_yaw=pi/2, downrange_axis=1,
# launch_box=(-0.15, 0.15, 0.45, 0.70), goal_xy=goal_xy) (see
# examples/simple/curling.py's ``--rotate90`` flag). If ``curling_circle.yaml``
# is ever regenerated, re-derive this file the same way rather than hand-
# editing it -- do not sample a fresh, independent bank for this variant, or
# the two banks stop being comparable shot-for-shot.
#
# Everything else (task/shape/scale/goal_drift, launch-box-membership
# invariant on ee_xy) is identical to curling_circle.yaml -- see that file
# for the full rationale.

task: curling
shape: circle
scale: 1.0
goal_xy: [0.0, 1.0]
goal_drift:
  radius_xy: [0.0, 0.0]
  freq_xy: [0.0, 0.0]
  yaw_amp: 0.0
  yaw_freq: 0.0
