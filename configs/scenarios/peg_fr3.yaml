# Frozen start states for Peg-FR3. See bampc/config/scenarios.py.
# Generated by `make_scenarios.py --task peg_fr3`.
#
# The peg tip is IK'd to a world-frame `tip_pos` ABOVE and off-axis from the
# socket mouth, so the planner has to find the hole rather than descend straight
# in. The peg is held rigidly, so there is no free object and the states are
# near-static. Clearance-INDEPENDENT: the socket's xy and mouth height do not
# depend on clearance, so this one bank serves every clearance config.
#
# Each row also carries a frozen `mount_offset` -- an SE(3) perturbation of
# where the peg is bolted to the wrist, sampled on its own RNG stream so it
# never perturbs `tip_pos`. It is the reproducible form of what `--true-offset`
# would otherwise draw at runtime; the examples prefer it when present.

task: peg_fr3
# shape/scale are placeholders -- PegFr3 has no shape library (build_peg_spec)
# and never reads them; the loader requires the keys.
shape: peg
scale: 1.0

# Static goal (the seated pose does not move), so every drift amplitude is 0
# and drift_phase_time is 0 throughout.
goal_drift:
  radius_xy: [0.0, 0.0]
  freq_xy: [0.0, 0.0]
  yaw_freq: 0.0

scenarios:
