# Frozen start states for Push. See bampc/config/scenarios.py. Generated
# by scripts/probing/make_scenarios.py, which samples a Latin hypercube over the
# ranges below and validates each pose on CPU MuJoCo. Re-validate with `--check`
# after any model change.
#
# `pusher_xy` is a JOINT coordinate, not a world one -- the pusher body carries
# pos="0 0.1 0.011", so world = pusher_xy + (0, 0.1). The standoff is a 6-25 mm
# surface clearance bisected in the world frame, because a fixed radial offset
# from the block's joint origin buries the pusher inside the asymmetric T.

task: push
# The bank is only valid for the geometry it was generated against: shape
# sets both the resting height and the clearance the standoff was solved for.
shape: t
scale: 1.0
# Goal is compiled at the world origin.
goal_xy: [0.0, 0.0]

# One drift for every experiment on this task, so a run's excitation is
# never an uncontrolled variable. Speed is the binding constraint, not
# amplitude: the goal peaks at 2*pi*f*radius = 1.9 cm/s here, which the
# pusher can still shepherd a T-block after (block/goal correlation ~ +0.9).
goal_drift:
  radius_xy: [0.06, 0.06]
  freq_xy: [0.03, 0.05]
  yaw_amp: 0.15
  yaw_freq: 0.04

# drift_phase_time is spread evenly over the slowest drift period (1/0.03 =
# 33.3 s), so the 16 scenarios sample the goal trajectory uniformly instead
# of each drawing a random phase.
scenarios:
  - {block_xy: [-0.0842, -0.0572], block_yaw: -0.1785, pusher_xy: [-0.1097, -0.2034], drift_phase_time: 0.0}
