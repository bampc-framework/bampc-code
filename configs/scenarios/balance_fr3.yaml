# Frozen start states for Balance-FR3. See bampc/config/scenarios.py.
#
# Generated by scripts/probing/make_scenarios.py --task balance_fr3. The arm
# starts at the 'home' keyframe (level plate) and the block rests on the plate
# at a plate-local block_xy -- unlike planar Balance there is no gimbal tilt to
# excite the ball, so the states start near-static (FR3 drift ~0.1 mm).
#
# Shape is SPHERE (not planar Balance's circle puck) so rolling friction is a
# meaningful mismatch parameter -- the block/plate defaults carry condim=6.

task: balance_fr3
shape: sphere
scale: 1.0
# Constructor argument, not compiled: pass this to BalanceFr3(goal_xy=...).
goal_xy: [0.05, 0.04]

# BalanceFr3 validates the drift against the plate at construction and RAISES if
# |goal_xy| + radius > 0.15 per axis, so radius <= 0.10; 0.05 leaves margin
# (0.05 + 0.05 = 0.10). yaw is ignored -- a ball has no orientation to track.
goal_drift:
  radius_xy: [0.04, 0.04]
  freq_xy: [0.06, 0.06]

scenarios:
  - {block_xy: [0.0243, -0.0436], drift_phase_time: 0.0}
  - {block_xy: [0.0747, -0.0115], drift_phase_time: 1.042}
  - {block_xy: [-0.0424, 0.0047], drift_phase_time: 2.083}
  - {block_xy: [-0.09, 0.0397], drift_phase_time: 3.125}
  - {block_xy: [-0.0016, -0.0307], drift_phase_time: 4.167}
  - {block_xy: [-0.0262, -0.0815], drift_phase_time: 5.208}
  - {block_xy: [0.0304, -0.0151], drift_phase_time: 6.25}
  - {block_xy: [0.0123, 0.0796], drift_phase_time: 7.292}
  - {block_xy: [-0.0129, -0.0509], drift_phase_time: 8.333}
  - {block_xy: [0.0522, 0.0701], drift_phase_time: 9.375}
  - {block_xy: [-0.0537, 0.0993], drift_phase_time: 10.417}
