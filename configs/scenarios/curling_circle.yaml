# Frozen start states for Curling-FR3 with the "circle" puck. Seed i is the same
# pose in every experiment, so a run is reproducible from (bank, index) alone.
#
# Regenerate with `make_scenarios.py --task curling_circle` and paste the
# printed `scenarios:` block below, keeping these hand-written comments.
# Re-validate with `--check` after any model change -- a scenario that starts
# interpenetrating silently corrupts every result that uses it.
#
# What varies: the puck's planar pose near the front of the launch box and the
# EE's standoff behind it on the puck->house line. What does not: the house.
# ScenarioBank carries one goal per task, so a range of shot distances means a
# second bank, not a per-row goal. goal_drift is all-zero -- a house does not
# move.
#
# The EE start MUST lie inside CurlingFr3's launch_box (0.40..0.65 x,
# -0.15..0.15 y), or the barrier yanks the arm on step 1 and reads as a planner
# failure. set_initial_state clamps and warns.

task: curling
shape: circle
scale: 1.0
goal_xy: [1.00, 0.0]
goal_drift:
  radius_xy: [0.0, 0.0]
  freq_xy: [0.0, 0.0]
  yaw_amp: 0.0
  yaw_freq: 0.0
scenarios:
  - {block_xy: [0.603, 0.075], block_yaw: -0.4799, ee_xy: [0.5252, 0.0836], drift_phase_time: 0.0}
  - {block_xy: [0.5797, 0.0507], block_yaw: 0.5347, ee_xy: [0.5089, 0.0763], drift_phase_time: 0.0}
