# Frozen start states for Balance. See bampc/config/scenarios.py.
#
# Generated by scripts/probing/make_scenarios.py. Each state carries an initial
# plate `tilt`, so the states do NOT hold still -- that is deliberate: a level
# plate would make every episode start from the same (zero) excitation, which
# is the one thing this task has least of.

task: balance
shape: circle
scale: 1.0
# Constructor argument, not compiled: pass this to Balance(goal_xy=...).
goal_xy: [0.05, 0.06]

# Balance validates the drift against the plate at construction and RAISES
# if |goal_xy| + radius > 0.12 per axis, so radius <= 0.06; 0.04 leaves
# margin (0.06 + 0.04 = 0.10). yaw is ignored by design -- Balance's cost is
# a distance to a point, so there is no orientation to track.
goal_drift:
  radius_xy: [0.04, 0.04]
  freq_xy: [0.11, 0.17]
  yaw_amp: 0.0
  yaw_freq: 0.0

# block_xy is in the PLATE's local frame; tilt is (roll, pitch) hinge angles
# in radians. drift_phase_time spreads evenly over 1/0.11 = 9.09 s.
#
# The ball slides on a tilted plate, so these do not hold still: measured
# drift over 0.25 s of zero control is up to 13.9 mm. That is the tilt
# working as intended, not a bad start state -- the plate is level only if
# tilt is (0, 0).
scenarios:
  - {block_xy: [0.0908, -0.0713], tilt: [0.0488, 0.0006], drift_phase_time: 0.0}
  - {block_xy: [-0.055, -0.0159], tilt: [-0.0301, 0.0378], drift_phase_time: 0.568}
  - {block_xy: [0.0034, 0.0582], tilt: [-0.0465, -0.0241], drift_phase_time: 1.136}
  - {block_xy: [-0.0946, 0.0334], tilt: [-0.0161, -0.046], drift_phase_time: 1.705}
  - {block_xy: [0.0496, -0.079], tilt: [0.0212, 0.0074], drift_phase_time: 2.273}
  - {block_xy: [0.0543, 0.0939], tilt: [0.0306, -0.0327], drift_phase_time: 2.841}
  - {block_xy: [-0.021, -0.0509], tilt: [-0.0096, -0.0019], drift_phase_time: 3.409}
  - {block_xy: [0.0138, 0.0138], tilt: [0.0325, 0.018], drift_phase_time: 3.977}
  - {block_xy: [-0.079, -0.0269], tilt: [-0.0397, 0.0463], drift_phase_time: 4.545}
  - {block_xy: [0.069, -0.0426], tilt: [0.0179, 0.0277], drift_phase_time: 5.114}
  - {block_xy: [-0.0263, 0.0827], tilt: [0.0114, -0.0406], drift_phase_time: 5.682}
  - {block_xy: [-0.0663, -0.0958], tilt: [0.0408, -0.0174], drift_phase_time: 6.25}
  - {block_xy: [-0.0112, -0.012], tilt: [-0.0331, -0.0096], drift_phase_time: 6.818}
  - {block_xy: [-0.0388, 0.0479], tilt: [-0.0226, 0.0373], drift_phase_time: 7.386}
  - {block_xy: [0.0824, 0.0096], tilt: [0.0025, -0.03], drift_phase_time: 7.955}
  - {block_xy: [0.0271, 0.0648], tilt: [-0.0025, 0.0195], drift_phase_time: 8.523}
