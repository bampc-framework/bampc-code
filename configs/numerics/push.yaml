# Solver/integrator options for Push, shared by its examples and sweeps.
# Keys are ModelConfig field names; the loader whitelist is
# derived from the dataclass, so a new field needs no loader change.
timestep: 0.01
solver: Newton
integrator: Euler
cone: pyramidal
jacobian: auto
impratio: 1.0
iterations: 1
ls_iterations: 4
eulerdamp: true
warmstart: true

# Unset = inherit the task's _BASELINE, not a MuJoCo default (configs/README.md).
# tolerance: 1e-8
# ls_tolerance: 0.01
