name: dr-mismatch-push-friction-truth-10hz-v1
task: push_fr3

# Friction-mismatch-per-truth-level grid, 10 Hz leg. See
# experiments/model_mismatch/README.md's "Which role gets the offset"
# section and harness.py's truth_grid_spec for the bias_target: truth_grid
# mechanism.
#
# The question: does the friction_<mult> arms' sensitivity ranking look the
# same regardless of which real friction (of a plausible mu range) the
# block/table pair actually has, not just at one assumed nominal (mu 0.5,
# the current model).
#
# true_bias_grid multipliers (0.2x/2.0x) of the nominal block sliding
# friction 0.5 (from models/push_fr3/free/scene.xml's `tblock` default):
# mu 0.1 (low, near-frictionless) / mu 1.0 (high, rubber-on-rubber) -- a
# plausible [0.1, 1.0] envelope for a printed block on a table/acrylic
# surface (rubber tops out around mu 1.0-1.5). The middle/current-nominal
# cell (1.0x = mu 0.5) is deliberately dropped: it would reproduce a plain
# friction_<mult> sweep at the SAME truth.
#
# num_seeds=4/repeats=4 (not the usual 8/4): this grid x 2 params x 3 rates
# x 2 tasks is a big overnight batch, and halving num_seeds keeps 16
# episodes/arm (still far more than quick mode's 1) at half the wall-clock.
#
# Budget: this 10 Hz rate's own real-time capacity. Every rate in the family
# is calibrated separately -- see mass_truth_10hz_v1's header for how to
# bisect one, and for why it is per rate.
#
# Only bias_target, true_bias_grid, bias_params (friction only), num_seeds
# and the budget differ from the other legs of this family.

scenario_bank: push_fr3_t

planner:
  profile: push_fr3
  overrides: {algo: ps, sample_budget: 13500}

prediction:
  numerics: fr3_free
truth:
  backend: warp
  numerics: fr3_free

bias_target: truth_grid
bias_params: [friction]
true_bias_grid: [0.2, 2.0]

num_seeds: 4
repeats: 4

rollout_time: 10.0
plan_freq_hz: 10

num_domains: 12  # unused (no wide_dr arms); kept for schema, not a knob here

algos: [ps]

# Relative to EACH true_bias_grid cell, not the global nominal -- see
# truth_grid_spec. Same multiplier set as every other leg of this family.
arms:
  - nominal
  - friction_0.02
  - friction_0.1
  - friction_0.25
  - friction_0.5
  - friction_2.0
  - friction_4.0
  - friction_10.0
  - friction_50.0

task_params:
  sampling_space: task
  manipulation_type: free
  reward_profile: push_fr3
