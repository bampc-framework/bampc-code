name: dr-mismatch-balance-friction-truth-20hz-v1
task: balance_fr3

# 20 Hz twin of friction_truth_10hz_v1 -- read that config's header for
# the full motivation. sample_budget is this rate's own budget, shared with
# mass_truth_20hz_v1 / rolling_friction_truth_20hz_v1; see
# mass_truth_10hz_v1's header for how a rate's budget is bisected. Same
# true_bias_grid, same arms, same num_seeds; only plan_freq_hz and
# sample_budget differ.

scenario_bank: balance_fr3
bias_params: [friction]

planner:
  profile: balance_fr3
  overrides: {algo: mppi, sample_budget: 2800}  # this rate's real-time budget

prediction:
  numerics: balance_fr3
truth:
  backend: warp
  numerics: balance_fr3

bias_target: truth_grid
true_bias_grid: [2.5, 10.0]

num_seeds: 4
repeats: 4

rollout_time: 10.0
plan_freq_hz: 20

num_domains: 10  # unused (no wide_dr arms); kept for schema, not a knob here

algos: [mppi]

# Relative to EACH true_bias_grid cell, not the global nominal -- see
# truth_grid_spec. Same multiplier set as every other leg of this family.
arms:
  - nominal
  - friction_0.02
  - friction_0.1
  - friction_0.25
  - friction_0.5
  - friction_2.0
  - friction_4.0
  - friction_10.0
  - friction_50.0

task_params:
  sampling_space: joint
  reward_profile: balance_fr3
